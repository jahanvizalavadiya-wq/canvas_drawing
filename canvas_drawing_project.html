<!DOCTYPE html>
<html>
<head>
    <title>Canvas Drawing App with Selectable Shapes</title>
    <style>
        body { font-family: Arial; text-align: center; background:#f4f4f4; }
        #toolbar { margin: 15px; }
        canvas { border:2px solid black; background:white; cursor: crosshair; }
        button, select, input { margin:5px; padding:6px; }
    </style>
</head>
<body>

<h2>🎨 Canvas Drawing App</h2>

<div id="toolbar">
    Shape:
    <select id="shapeSelect">
        <option value="rectangle">Rectangle</option>
        <option value="circle">Circle</option>
        <option value="triangle">Triangle</option>
        <option value="line">Line</option>
    </select>

    Color:
    <input type="color" id="colorPicker" value="#ff0000">

    Text:
    <input type="text" id="textInput" placeholder="Enter text">

    <button onclick="fillSelectedShape()">Fill Color</button>
    <button onclick="addTextToShape()">Add Text</button>
    <button onclick="clearCanvas()">Clear</button>
</div>

<canvas id="canvas" width="800" height="450"></canvas>

<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
const shapeSelect = document.getElementById("shapeSelect");
const colorPicker = document.getElementById("colorPicker");
const textInput = document.getElementById("textInput");

let shapes = [];
let selectedShape = null;
let isDragging = false;
let isDrawing = false;
let offsetX, offsetY;

class Shape {
    constructor(type, x, y, w, h) {
        this.type = type;
        this.x = x;
        this.y = y;
        this.w = w;
        this.h = h;
        this.fill = null;
        this.text = "";
    }

    draw() {
        ctx.beginPath();
        if (this.type === "rectangle") ctx.rect(this.x, this.y, this.w, this.h);
        else if (this.type === "circle") { let r=Math.sqrt(this.w*this.w+this.h*this.h); ctx.arc(this.x,this.y,r,0,Math.PI*2); }
        else if (this.type === "triangle") { ctx.moveTo(this.x,this.y); ctx.lineTo(this.x+this.w,this.y+this.h); ctx.lineTo(this.x-this.w,this.y+this.h); ctx.closePath(); }
        else if (this.type === "line") ctx.moveTo(this.x,this.y), ctx.lineTo(this.x+this.w,this.y+this.h);
        ctx.stroke();
        if (this.fill && this.type !== "line") ctx.fillStyle=this.fill, ctx.fill();
        if (this.text) { ctx.fillStyle="black"; ctx.font="18px Arial"; ctx.fillText(this.text,this.x+10,this.y+20); }
    }

    contains(mx,my){
        if(this.type=="rectangle") return mx>=this.x&&mx<=this.x+this.w&&my>=this.y&&my<=this.y+this.h;
        if(this.type=="circle") { let r=Math.sqrt(this.w*this.w+this.h*this.h); return Math.hypot(mx-this.x,my-this.y)<=r; }
        if(this.type=="triangle") return Math.abs(mx-this.x)<Math.abs(this.w)&&my>=this.y&&my<=this.y+this.h;
        if(this.type=="line") { const dx=this.w,dy=this.h,length=Math.sqrt(dx*dx+dy*dy),proj=((mx-this.x)*dx+(my-this.y)*dy)/(length*length),closestX=this.x+proj*dx,closestY=this.y+proj*dy; return Math.hypot(mx-closestX,my-closestY)<5; }
        return false;
    }
}

canvas.addEventListener("mousedown",e=>{
    let mx=e.offsetX,my=e.offsetY;
    selectedShape=shapes.find(s=>s.contains(mx,my));
    if(selectedShape){
        isDragging=true;
        offsetX=mx-selectedShape.x;
        offsetY=my-selectedShape.y;
    }else{
        isDrawing=true;
        let newShape=new Shape(shapeSelect.value,mx,my,0,0);
        shapes.push(newShape);
        selectedShape=newShape;
    }
});

canvas.addEventListener("mousemove",e=>{
    if(!selectedShape) return;
    let mx=e.offsetX,my=e.offsetY;
    if(isDragging) selectedShape.x=mx-offsetX,selectedShape.y=my-offsetY;
    else if(isDrawing) selectedShape.w=mx-selectedShape.x,selectedShape.h=my-selectedShape.y;
    redraw();
});

canvas.addEventListener("mouseup",e=>{ isDragging=false; isDrawing=false; });
canvas.addEventListener("mouseleave",e=>{ isDragging=false; isDrawing=false; });

function fillSelectedShape(){
    if(selectedShape && selectedShape.type!="line"){
        selectedShape.fill=colorPicker.value;
        redraw();
    }
}

function addTextToShape(){
    if(selectedShape){
        selectedShape.text=textInput.value;
        redraw();
    }
}

function redraw(){ ctx.clearRect(0,0,canvas.width,canvas.height); shapes.forEach(s=>s.draw()); }
function clearCanvas(){ shapes=[]; selectedShape=null; redraw(); }
</script>

</body>
</html>
